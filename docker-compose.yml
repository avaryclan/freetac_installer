version: '3.8'

services:
  freetak-server:
    build: .
    container_name: freetak-server
    restart: unless-stopped
    ports:
      - "8087:8087"   # TCP COT
      - "8089:8089"   # SSL COT
      - "9000:9000"   # Federation
      - "19023:19023" # REST API
      - "5000:5000"   # Web UI
    volumes:
      - ./data:/opt/FreeTAKServer/data
      - ./logs:/opt/FreeTAKServer/logs
      - ./config:/opt/FreeTAKServer/config
    environment:
      - FTS_IP=0.0.0.0
      - FTS_PORT=8087
      - FTS_SSL_PORT=8089
      - FTS_FEDERATION_PORT=9000
      - FTS_API_PORT=19023
      - FTS_UI_PORT=5000
    networks:
      - freetak-network

  # Дополнительный сервис для видеосервера (MediaMTX)
  video-server:
    image: bluenviron/mediamtx:latest
    container_name: freetak-video-server
    restart: unless-stopped
    ports:
      - "9997:9997"
      - "8888:8888"  # Web UI для MediaMTX
    networks:
      - freetak-network

  # Дополнительный сервис для голосового сервера (Mumble)
  voice-server:
    image: mumblevoip/mumble-server:latest
    container_name: freetak-voice-server
    restart: unless-stopped
    ports:
      - "64739:64738/udp"
      - "64739:64738/tcp"
    environment:
      - MUMBLE_SUPERUSER_PASSWORD=changeme123
      - MUMBLE_SERVER_PASSWORD=changeme456
    networks:
      - freetak-network

networks:
  freetak-network:
    driver: bridge